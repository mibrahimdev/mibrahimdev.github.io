<section class="cv-section" id="education" aria-labelledby="education-title">
  <h2 class="cv-section-title" id="education-title">Education</h2>
  <ul class="cv-education">
    {% for edu in site.data.education %}
    <li class="cv-edu-item">
      <h3 class="cv-edu-institution">{{ edu.institution }}</h3>
      <p class="cv-edu-qualification">
        {{ edu.qualification }}{% if edu.field and edu.field != "" %} &mdash; {{ edu.field }}{% endif %}
      </p>
      <p class="cv-edu-year">{{ edu.year }}</p>
    </li>
    {% endfor %}
  </ul>
</section>
