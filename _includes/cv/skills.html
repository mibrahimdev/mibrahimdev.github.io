<!-- cv/skills.html — headline "core skills" pills (highlighted accent chips). -->
<section class="section tight" id="skills" aria-labelledby="skills-title">
  <div class="section-head">
    <div>
      <div class="eyebrow">grep -i core</div>
      <h2 id="skills-title">Core skills</h2>
    </div>
  </div>
  <div class="pills">
    {% for skill in site.data.skills.core %}
    <span class="pill key">{{ skill }}</span>
    {% endfor %}
  </div>
</section>
