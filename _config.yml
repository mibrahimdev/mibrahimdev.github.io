# Site settings

# Site name shown in the masthead and as part of the page title in search results
name: Mohamed Ibrahim

# Short description shown under the name and as part of the page title in search results
description: "Senior Android Engineer · Kotlin, Jetpack Compose, Kotlin Multiplatform"

# Avatar shown in the masthead
avatar: https://github.com/mibrahimdev.png

# Social card used by jekyll-seo-tag for link previews (1200x630)
image: /images/social-card.png

# Social icons (modern inline-SVG set — see _includes/svg-icons.html).
# Rendered in the home hero and the site footer.
footer-links:
  github: mibrahimdev
  linkedin: mibrahimdev
  stackoverflow: /users/4252667/mohamed-ibrahim
  youtube: "@mibrahimdev" # quoted — a leading @ is reserved in YAML
  email: mibrahim.dev@gmail.com
  rss: true # any value here shows the RSS icon

# Download CV — direct PDF export of the public Google Doc (always the latest
# version, no committed binary). Swap the doc id if the CV moves.
cv_url: https://docs.google.com/document/d/19t0GOOusM0mNlJBHKPU1zR8bi7fLvXyPaOsIL6qKOpI/export?format=pdf

# YouTube channel — drives the /videos/ tab. The uploads playlist is the
# channel id with the leading "UC" swapped for "UU"; embedding it always
# shows the latest uploads with zero maintenance.
youtube:
  handle: "@mibrahimdev"
  url: https://www.youtube.com/@mibrahimdev
  channel_id: UCGbugmMPs-ChfBcA81p2YZQ
  uploads_playlist: UUGbugmMPs-ChfBcA81p2YZQ
  tagline: "Learn it by doing, master it by explaining — enjoy the journey in between."

# Site URL, used in RSS and sitemap.xml.
# Stays on the github.io host until the custom domain is live (see plan §8).
url: http://mibrahimdev.github.io/

baseurl: ""


#
# Jekyll settings — no need to edit these
#

permalink: /:title/

# The release of Jekyll Now that you're using
version: v1.2.0

# Jekyll 3 now only supports Kramdown for Markdown
kramdown:
  # Use GitHub flavored markdown, including triple backtick fenced code blocks
  input: GFM
  # Jekyll 3 and GitHub Pages now only support rouge for syntax highlighting
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    # Use existing pygments syntax highlighting css
    css_class: "highlight"

# Set the Sass partials directory, as we're using @imports
# sass:
#   style: :expanded # You might prefer to minify using :compressed

# Use the following plug-ins
plugins:
  - jekyll-sitemap # Create a sitemap using the official Jekyll sitemap gem
  - jekyll-feed # Create an Atom feed using the official Jekyll feed gem
  - jekyll-seo-tag # SEO, Open Graph, Twitter cards, and JSON-LD

# Exclude these files from your production _site
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
