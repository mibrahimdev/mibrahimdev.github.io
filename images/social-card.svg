<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5aa0f0"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <style>
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0f1115"/>

  <!-- Subtle window-chrome dots (terminal motif) -->
  <g>
    <circle cx="80" cy="80" r="9" fill="#ff5f56"/>
    <circle cx="112" cy="80" r="9" fill="#ffbd2e"/>
    <circle cx="144" cy="80" r="9" fill="#27c93f"/>
  </g>

  <!-- Prompt line -->
  <text x="80" y="240" class="mono" font-size="40" font-weight="500" fill="#7d8590">
    <tspan fill="#27c93f">$</tspan> <tspan fill="#8b949e">whoami</tspan>
  </text>

  <!-- Name -->
  <text x="80" y="350" class="mono" font-size="92" font-weight="700" fill="#f5f7fa">Mohamed Ibrahim</text>

  <!-- Subtitle -->
  <text x="80" y="430" class="mono" font-size="48" font-weight="500" fill="#5aa0f0">Senior Android Engineer</text>

  <!-- Accent line -->
  <rect x="80" y="478" width="360" height="6" rx="3" fill="url(#accent)"/>

  <!-- Tech tagline -->
  <text x="80" y="552" class="mono" font-size="28" font-weight="400" fill="#8b949e">Kotlin · Jetpack Compose · Multiplatform</text>

  <!-- URL bottom-right -->
  <text x="1120" y="600" text-anchor="end" class="mono" font-size="24" font-weight="400" fill="#5b6470">mibrahimdev.github.io</text>
</svg>
